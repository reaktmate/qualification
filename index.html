<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>取りたい資格リスト</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --text:#1f2937; --sub:#6b7280; --line:#e5e7eb;
    --accent:#2563eb; --want:#f59e0b; --study:#2563eb; --done:#16a34a;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1115; --card:#181b22; --text:#e5e7eb; --sub:#9ca3af; --line:#2a2e38; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
  .wrap{max-width:860px;margin:0 auto;padding:24px 16px 64px}
  h1{font-size:1.5rem;margin:0 0 4px}
  .lead{color:var(--sub);margin:0 0 20px;font-size:.9rem}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:100px}
  .stat b{display:block;font-size:1.4rem}
  .stat span{font-size:.75rem;color:var(--sub)}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:20px}
  .bar i{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  input,select,textarea,button{font:inherit;color:inherit}
  input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
  .tools input{flex:1;min-width:160px;width:auto}
  .tools select{width:auto}
  button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button:hover{filter:brightness(.96)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
  .list{display:grid;gap:12px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-left:5px solid var(--want)}
  .item.study{border-left-color:var(--study)} .item.done{border-left-color:var(--done)}
  .item h3{margin:0 0 6px;font-size:1.05rem;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .item.done h3 span.name{text-decoration:line-through;opacity:.6}
  .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.78rem;color:var(--sub);margin-bottom:6px}
  .tag{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
  .memo{font-size:.88rem;white-space:pre-wrap;margin:6px 0 0}
  .actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .actions button{padding:4px 10px;font-size:.8rem}
  .stars{color:var(--want);letter-spacing:1px;white-space:nowrap}
  .empty{text-align:center;color:var(--sub);padding:40px 0}
  dialog{border:none;border-radius:16px;padding:20px;width:min(480px,92vw);background:var(--card);color:var(--text)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  dialog h2{margin:0 0 12px;font-size:1.15rem}
  label{display:block;font-size:.8rem;color:var(--sub);margin:10px 0 4px}
  .row{display:flex;gap:10px} .row>div{flex:1}
  .dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .ico{font-size:1.5rem;line-height:1;margin-right:8px}
  .item h3 .name{flex:1}
  .picker{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .picker button{font-size:1.2rem;padding:2px 6px;border-radius:8px;line-height:1.4}
  .picker button.on{background:var(--accent);border-color:var(--accent)}
  .iconRow{display:flex;gap:8px;align-items:center}
  .iconRow input{width:72px;text-align:center;font-size:1.3rem}
  footer{margin-top:28px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  footer button{font-size:.8rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎓 取りたい資格リスト</h1>
  <p class="lead">データはこのブラウザ内（localStorage）に保存されます。</p>

  <div class="stats">
    <div class="stat"><b id="sAll">0</b><span>全部</span></div>
    <div class="stat"><b id="sWant">0</b><span>取りたい</span></div>
    <div class="stat"><b id="sStudy">0</b><span>勉強中</span></div>
    <div class="stat"><b id="sDone">0</b><span>取得済み</span></div>
  </div>
  <div class="bar"><i id="bar"></i></div>

  <div class="tabs" id="tabs">
    <button data-s="all" class="on">すべて</button>
    <button data-s="want">取りたい</button>
    <button data-s="study">勉強中</button>
    <button data-s="done">取得済み</button>
  </div>

  <div class="tools">
    <input id="q" type="search" placeholder="検索（資格名・メモ）">
    <select id="sort">
      <option value="pri">優先度順</option>
      <option value="date">目標日順</option>
      <option value="new">追加が新しい順</option>
    </select>
    <button class="primary" id="addBtn">＋ 追加</button>
  </div>

  <div class="list" id="list"></div>

  <footer>
    <button id="exportBtn">エクスポート(JSON)</button>
    <button id="importBtn">インポート</button>
    <input type="file" id="file" accept="application/json" hidden>
  </footer>
</div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlgTitle">資格を追加</h2>
    <label>アイコン（絵文字）</label>
    <div class="iconRow">
      <input id="fIcon" maxlength="4" placeholder="🎓">
      <span style="font-size:.78rem;color:var(--sub)">下から選ぶか、好きな絵文字を入力</span>
    </div>
    <div class="picker" id="picker"></div>
    <label>資格名 *</label>
    <input id="fName" required placeholder="例：基本情報技術者試験">
    <div class="row">
      <div>
        <label>分野</label>
        <input id="fCat" placeholder="例：IT / 語学 / 動画">
      </div>
      <div>
        <label>ステータス</label>
        <select id="fStatus">
          <option value="want">取りたい</option>
          <option value="study">勉強中</option>
          <option value="done">取得済み</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label>優先度</label>
        <select id="fPri">
          <option value="3">★★★ 高</option>
          <option value="2" selected>★★ 中</option>
          <option value="1">★ 低</option>
        </select>
      </div>
      <div>
        <label>目標日（受験日など）</label>
        <input id="fDate" type="date">
      </div>
    </div>
    <label>メモ（URL・勉強方法・費用など）</label>
    <textarea id="fMemo" rows="3"></textarea>
    <div class="dlg-actions">
      <button type="button" id="cancel">キャンセル</button>
      <button class="primary" id="save" value="default">保存</button>
    </div>
  </form>
</dialog>

<script>
const KEY = "shikaku-list-v1";
const LABEL = {want:"取りたい", study:"勉強中", done:"取得済み"};
let items = load();
let filter = "all";
let editId = null;

function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(Array.isArray(d)) return d;
  }catch(e){}
  return [
    {id:uid(), name:"基本情報技術者試験", cat:"IT", status:"want", pri:3, date:"", memo:"サンプルです。編集・削除できます。", created:Date.now()}
  ];
}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(items)); }catch(e){} }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const $ = id => document.getElementById(id);

function render(){
  const cnt = s => items.filter(i=>i.status===s).length;
  $("sAll").textContent = items.length;
  $("sWant").textContent = cnt("want");
  $("sStudy").textContent = cnt("study");
  $("sDone").textContent = cnt("done");
  $("bar").style.width = items.length ? (cnt("done")/items.length*100)+"%" : "0";

  const q = $("q").value.trim().toLowerCase();
  let view = items.filter(i =>
    (filter==="all" || i.status===filter) &&
    (!q || (i.name+" "+i.cat+" "+i.memo).toLowerCase().includes(q))
  );
  const sort = $("sort").value;
  view.sort((a,b)=>{
    if(sort==="pri") return b.pri-a.pri || (b.created-a.created);
    if(sort==="date") return (a.date||"9999").localeCompare(b.date||"9999");
    return b.created-a.created;
  });

  $("list").innerHTML = view.length ? view.map(i=>`
    <div class="item ${i.status}">
      <h3><span class="ico">${esc(i.icon||"🎓")}</span><span class="name">${esc(i.name)}</span><span class="stars">${"★".repeat(i.pri)}</span></h3>
      <div class="meta">
        <span class="tag">${LABEL[i.status]}</span>
        ${i.cat?`<span class="tag">${esc(i.cat)}</span>`:""}
        ${i.date?`<span class="tag">📅 ${esc(i.date)}</span>`:""}
      </div>
      ${i.memo?`<p class="memo">${linkify(esc(i.memo))}</p>`:""}
      <div class="actions">
        ${i.status!=="done"?`<button data-a="next" data-id="${i.id}">${i.status==="want"?"勉強開始":"取得した！"}</button>`:""}
        <button data-a="edit" data-id="${i.id}">編集</button>
        <button data-a="del" data-id="${i.id}">削除</button>
      </div>
    </div>`).join("") : `<div class="empty">まだ何もありません。「＋ 追加」から登録しよう</div>`;
}
function linkify(s){
  return s.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
}

function openDlg(item){
  editId = item ? item.id : null;
  $("dlgTitle").textContent = item ? "資格を編集" : "資格を追加";
  $("fIcon").value = item?.icon ?? "🎓";
  markPicker();
  $("fName").value = item?.name ?? "";
  $("fCat").value = item?.cat ?? "";
  $("fStatus").value = item?.status ?? "want";
  $("fPri").value = item?.pri ?? 2;
  $("fDate").value = item?.date ?? "";
  $("fMemo").value = item?.memo ?? "";
  $("dlg").showModal();
}

$("addBtn").onclick = () => openDlg(null);
$("cancel").onclick = () => $("dlg").close();
$("form").addEventListener("submit", e => {
  if(!$("fName").value.trim()){ return; }
  const data = {
    icon:$("fIcon").value.trim() || "🎓",
    name:$("fName").value.trim(), cat:$("fCat").value.trim(),
    status:$("fStatus").value, pri:+$("fPri").value,
    date:$("fDate").value, memo:$("fMemo").value.trim()
  };
  if(editId){
    items = items.map(i=>i.id===editId ? {...i,...data} : i);
  }else{
    items.push({id:uid(), created:Date.now(), ...data});
  }
  persist(); render();
});

$("list").onclick = e => {
  const b = e.target.closest("button[data-a]"); if(!b) return;
  const id = b.dataset.id, it = items.find(i=>i.id===id); if(!it) return;
  if(b.dataset.a==="edit") openDlg(it);
  if(b.dataset.a==="del" && confirm(`「${it.name}」を削除しますか？`)){
    items = items.filter(i=>i.id!==id); persist(); render();
  }
  if(b.dataset.a==="next"){
    it.status = it.status==="want" ? "study" : "done"; persist(); render();
  }
};
$("tabs").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  filter = b.dataset.s;
  [...$("tabs").children].forEach(x=>x.classList.toggle("on", x===b));
  render();
};
$("q").oninput = render;
$("sort").onchange = render;

$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(items,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "shikaku-list.json"; a.click();
  URL.revokeObjectURL(a.href);
};
$("importBtn").onclick = () => $("file").click();
$("file").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!Array.isArray(d)) throw 0;
      items = d.map(i=>({id:i.id||uid(), icon:String(i.icon||"🎓"), name:String(i.name||""), cat:String(i.cat||""),
        status:LABEL[i.status]?i.status:"want", pri:[1,2,3].includes(+i.pri)?+i.pri:2,
        date:i.date||"", memo:String(i.memo||""), created:i.created||Date.now()}));
      persist(); render();
    }catch(err){ alert("読み込めないファイルです"); }
  };
  r.readAsText(f); e.target.value = "";
};

const ICONS = ["🎓","💻","🖥️","🌐","📊","📈","💰","🧾","⚖️","🏗️","🔧","⚡","🚗","✈️","🎬","🎨","🎵","📷","🗣️","🇬🇧","🇯🇵","📚","✍️","🧪","🩺","🍳","🏆","📝","🔒","🤖"];
$("picker").innerHTML = ICONS.map(e=>`<button type="button" data-e="${e}">${e}</button>`).join("");
$("picker").onclick = e => {
  const b = e.target.closest("button[data-e]"); if(!b) return;
  $("fIcon").value = b.dataset.e; markPicker();
};
$("fIcon").oninput = markPicker;
function markPicker(){
  const v = $("fIcon").value.trim();
  [...$("picker").children].forEach(b=>b.classList.toggle("on", b.dataset.e===v));
}

render();
</script>
</body>
</html>
